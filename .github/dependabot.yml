version: 2
updates:

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "php"
      - "automerge"

  # Maintain dependencies for NPM
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
      - "automerge"
    ignore:
      # @vue/cli-plugin-babel (used by babel.config.js) is Babel 7-only.
      # A Babel 8 bump of @babel/core alone breaks `yarn build`.
      # Revisit when migrating off @vue/cli-plugin-babel / Vue CLI babel preset.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
